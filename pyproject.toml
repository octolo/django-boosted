[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-boosted"
version = "1.0.5"
description = "Reusable helpers to register custom Django admin views and object tools."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Octolo", email = "dev@octolo.tech"}
]
keywords = [
  "django",
  "django-admin",
  "admin-views",
  "admin-tools",
  "django-extensions",
  "admin-customization",
  "python",
]
dependencies = [
  "Django>=5.2,<6.0",
  "django-virtualqueryset>=1.0.0",
]
classifiers = [
  "Framework :: Django",
  "Framework :: Django :: 5.0",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.urls]
Homepage = "https://github.com/octolo/django-boosted"
Repository = "https://github.com/octolo/django-boosted"
Documentation = "https://github.com/octolo/django-boosted#readme"
Issues = "https://github.com/octolo/django-boosted/issues"

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-django>=4.8",
  "ruff>=0.7.0",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "mypy>=1.13",
  "django-stubs>=5.2,<6",
  "django-stubs-ext>=5.2,<6",
  "radon>=6.0",
  "vulture>=2.14",
  "coverage>=7.6",
  "pytest-cov>=6.0",
  "djangorestframework>=3.15",
]
drf = ["djangorestframework>=3.15"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
django_boosted = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "."]
addopts = "-ra"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["B", "C90", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["RUF012"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.mypy]
python_version = "3.11"
plugins = ["mypy_django_plugin.main"]
mypy_path = ["src", "."]
check_untyped_defs = true
warn_unused_configs = true
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "tests.settings"
strict_settings = false

[tool.coverage.run]
source = ["django_boosted"]

[tool.coverage.report]
fail_under = 65
show_missing = true
